spring.application.name=shopdue-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/shopdue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
shopdue.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value}
shopdue.jwt.expiration-ms=86400000
springdoc.swagger-ui.path=/swagger-ui.html
